[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesage"
version = "1.0.0"
description = "Local AI Code Reviewer powered by Ollama open-weight models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Himank Kaushik", email = "itshimankkaushik@gmail.com" }]
keywords = ["ai", "code-review", "ollama", "cli", "open-source", "hacktoberfest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=13.9.4",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "pygments>=2.18.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.66.5",
]

[project.urls]
Homepage = "https://github.com/Nobody-KnowsBetter/code-sage"
Repository = "https://github.com/Nobody-KnowsBetter/code-sage"
Issues = "https://github.com/Nobody-KnowsBetter/code-sage/issues"

[project.scripts]
codesage = "codesage.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codesage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["codesage"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
